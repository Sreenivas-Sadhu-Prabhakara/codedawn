<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0E1230; }
  body { display: grid; place-items: center; }
  /* 12% safe padding on each side -> mark fills the middle 76vmin */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <path d="M6 23a10 10 0 0 1 20 0" fill="none" stroke="#FFD27A" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="4" y1="23" x2="28" y2="23" stroke="#F5A524" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="16" y1="5.5" x2="16" y2="10" stroke="#FF7E5F" stroke-width="2.1" stroke-linecap="round"/>
    <line x1="6.5" y1="10.5" x2="9.3" y2="13.3" stroke="#FF7E5F" stroke-width="2.1" stroke-linecap="round"/>
    <line x1="25.5" y1="10.5" x2="22.7" y2="13.3" stroke="#FF7E5F" stroke-width="2.1" stroke-linecap="round"/>
  </svg>
</body>
</html>
