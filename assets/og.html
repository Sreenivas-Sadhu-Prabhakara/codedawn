<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --night:   #0E1230;
    --sky:     #171B3D;
    --line:    #343A6B;
    --paper:   #EEF0FA;
    --mist:    #A6ABD1;
    --amber:   #F5A524;
    --amber-2: #FFD27A;
    --dawn:    #FF7E5F;
    --teal:    #4FD1C5;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: linear-gradient(180deg, #0b0f28 0%, #0E1230 62%);
    font-family: var(--sans);
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
  }

  /* first-light horizon field */
  .dawnfield {
    position: absolute; left: 0; right: 0; bottom: 0; height: 300px;
  }
  .sun {
    position: absolute; left: 300px; bottom: 84px;
    width: 132px; height: 132px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #FFE0A0 0%, #F5A524 58%, rgba(245,165,36,0) 100%);
  }
  .horizonline {
    position: absolute; left: 0; right: 0; bottom: 150px;
    height: 2px; background: var(--amber); opacity: 0.8;
  }
  .glow {
    position: absolute; left: 0; right: 0; bottom: 0; height: 150px;
    background: linear-gradient(180deg, rgba(245,165,36,0.28), rgba(255,126,95,0.05) 60%, transparent);
  }

  .frame {
    position: absolute; inset: 0;
    padding: 82px 90px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .brand { display: flex; align-items: center; gap: 22px; }
  .mark {
    width: 76px; height: 76px; border-radius: 18px;
    background: var(--night); border: 1px solid var(--line);
    box-shadow: 0 18px 44px -22px rgba(0,0,0,0.7);
  }
  .wordmark {
    font-size: 62px; font-weight: 800; letter-spacing: -0.045em;
    line-height: 1; color: var(--paper);
  }
  .kicker {
    margin-left: 6px; padding-left: 22px;
    border-left: 1px solid var(--line);
    font-size: 24px; font-weight: 500; color: var(--mist);
    letter-spacing: -0.01em;
  }

  .headline { max-width: 940px; }
  .headline h1 {
    font-size: 66px; font-weight: 800; letter-spacing: -0.035em;
    line-height: 1.08; color: var(--paper);
  }
  .headline .accent { color: var(--amber-2); }
  .headline p {
    margin-top: 22px;
    font-size: 29px; font-weight: 500; letter-spacing: -0.01em;
    color: var(--mist); line-height: 1.35; max-width: 30ch;
  }

  .chips { display: flex; align-items: center; gap: 13px; }
  .chip {
    display: inline-flex; align-items: center; gap: 11px;
    padding: 12px 20px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(10,14,40,0.5);
    font-size: 22px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--mist);
  }
  .chip .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot--amber { background: var(--amber); box-shadow: 0 0 0 4px rgba(245,165,36,0.16); }
  .dot--teal  { background: var(--teal);  box-shadow: 0 0 0 4px rgba(79,209,197,0.16); }
  .dot--dawn  { background: var(--dawn);  box-shadow: 0 0 0 4px rgba(255,126,95,0.16); }
</style>
</head>
<body>
  <div class="dawnfield">
    <div class="glow"></div>
    <div class="sun"></div>
    <div class="horizonline"></div>
  </div>

  <div class="frame">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#0E1230"/>
        <path d="M6 23a10 10 0 0 1 20 0" fill="none" stroke="#FFD27A" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="4" y1="23" x2="28" y2="23" stroke="#F5A524" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="16" y1="6" x2="16" y2="10" stroke="#FF7E5F" stroke-width="2" stroke-linecap="round"/>
        <line x1="7" y1="11" x2="9.5" y2="13.5" stroke="#FF7E5F" stroke-width="2" stroke-linecap="round"/>
        <line x1="25" y1="11" x2="22.5" y2="13.5" stroke="#FF7E5F" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="wordmark">codedawn</span>
      <span class="kicker">a fresh lesson every morning</span>
    </div>

    <div class="headline">
      <h1>Learn one good thing<br><span class="accent">before the coffee's cold.</span></h1>
      <p>A date-seeded daily code lesson, hand-verified and fully offline.</p>
    </div>

    <div class="chips">
      <span class="chip"><span class="dot dot--amber"></span>daily pick</span>
      <span class="chip"><span class="dot dot--teal"></span>hand-verified</span>
      <span class="chip"><span class="dot dot--dawn"></span>no AI, no network</span>
      <span class="chip"><span class="dot dot--amber"></span>offline</span>
    </div>
  </div>
</body>
</html>
